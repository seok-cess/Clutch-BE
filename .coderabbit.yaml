# =============================================================================
# CLUTCH Backend - CodeRabbit Configuration
# =============================================================================
#
# 이 파일의 목적은 CodeRabbit이 "일반적으로 좋은 코드"를 강요하는 것이 아니라,
# CLUTCH 프로젝트의 설계 의도와 팀의 개발 방식을 이해한 상태에서
# 실질적인 코드 리뷰를 수행하도록 만드는 것이다.
#
# 리뷰의 핵심 우선순위는 다음과 같다.
#
#   1. PR 및 변경 코드에서 개발자가 무엇을 구현하려 했는지 파악한다.
#   2. docs 등 프로젝트 내부 문서에 기록된 설계/도메인 결정을 확인한다.
#   3. 프로젝트와 각 도메인에서 합의한 규칙 및 컨벤션을 확인한다.
#   4. 위 맥락을 바탕으로 실제 버그, 정합성, 동시성, 보안, 성능 문제를 찾는다.
#
# 따라서 단순히 "다른 방식이 더 좋아 보인다"는 이유만으로
# 기존 설계를 변경하도록 요구하지 않는다.
#
# 특히 프로젝트에서 의도적으로 선택한 구현을 일반적인 Best Practice와
# 다르다는 이유만으로 문제로 판단하지 않는다.
#
# =============================================================================


# 리뷰 결과와 설명은 기본적으로 한국어로 작성한다.
language: "ko-KR"


reviews:

  # ===========================================================================
  # Review Profile
  # ===========================================================================
  #
  # assertive:
  # 잠재적인 문제를 비교적 적극적으로 탐색하도록 한다.
  #
  # 단, 아래 path_instructions에서 리뷰 기준을 별도로 제한하여
  # 사소한 취향 차이까지 무분별하게 지적하지 않도록 한다.
  #
  # 즉,
  #
  #   "문제를 적극적으로 찾되,
  #    프로젝트의 의도와 근거 없이 문제를 만들어내지는 않는다."
  #
  # 가 기본 원칙이다.
  #
  profile: "assertive"


  # ===========================================================================
  # Automatic Review
  # ===========================================================================
  #
  # PR 생성 및 새로운 commit push 시 자동으로 리뷰한다.
  #
  # Draft PR은 아직 구현 방향이나 코드 구조가 확정되지 않은 상태일 가능성이
  # 높기 때문에 자동 리뷰 대상에서 제외한다.
  #
  auto_review:
    enabled: true
    drafts: false


  # ===========================================================================
  # Path Filters
  # ===========================================================================
  #
  # 빌드 결과물이나 자동 생성 파일은 개발자가 직접 작성한 코드가 아니므로
  # 리뷰 대상에서 제외한다.
  #
  # 이런 파일까지 리뷰하면 실제로 수정해야 할 코드에 대한 중요한 리뷰가
  # 불필요한 코멘트 사이에 묻힐 가능성이 있다.
  #
  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!**/generated/**"


  # ===========================================================================
  # Project-wide Review Principles
  # ===========================================================================
  #
  # 모든 Backend 코드에 적용되는 가장 중요한 리뷰 기준이다.
  #
  # CodeRabbit은 코드 한 줄만 보고 일반적인 정답을 제시하기보다
  # "왜 이 변경이 이루어졌는가?"를 먼저 파악해야 한다.
  #
  # 판단 근거의 우선순위:
  #
  #   PR의 목적/개발자의 의도
  #           ↓
  #   프로젝트 docs 및 명시된 설계 결정
  #           ↓
  #   해당 도메인의 기존 구현과 규칙
  #           ↓
  #   팀 컨벤션
  #           ↓
  #   일반적인 Spring/Java Best Practice
  #
  # 위쪽에 있는 근거가 아래쪽의 일반론보다 우선한다.
  #
  path_instructions:

    - path: "src/main/java/**"
      instructions: |
        이 프로젝트의 코드 리뷰에서 가장 중요한 것은 개발자의 구현 의도를
        정확하게 파악하는 것이다.

        코드를 독립적으로 평가하지 말고 PR의 목적, 변경된 코드의 흐름,
        관련 클래스, 기존 구현, 프로젝트 문서를 함께 확인하여
        개발자가 해결하려는 문제가 무엇인지 먼저 파악한다.

        리뷰 판단 시 다음 우선순위를 따른다.

        1. PR에서 해결하려는 문제와 개발자의 구현 의도
        2. 프로젝트 내부 docs에 기록된 요구사항, 아키텍처 및 설계 결정
        3. 해당 도메인에서 이미 합의되어 사용되고 있는 정책과 구현 방식
        4. 프로젝트 공통 컨벤션
        5. Java/Spring의 일반적인 Best Practice

        상위 기준과 하위 기준이 충돌한다면 상위 기준을 우선한다.

        예를 들어 프로젝트에서 특정 이유로 일반적인 Spring 관례와 다른
        구현 방식을 의도적으로 선택했다면, 단순히 Best Practice와 다르다는
        이유만으로 변경을 요구하지 않는다.

        기존 코드와 다른 구현이 발견되었을 경우에도 바로 문제라고 판단하지 않는다.

        먼저 다음을 확인한다.

        - 새로운 요구사항 때문에 의도적으로 변경된 것인지
        - 해당 도메인에서 별도로 정의한 정책이 있는지
        - docs에 관련 설계 결정이 기록되어 있는지
        - 기존 구현과의 차이가 실제 버그나 정합성 문제를 만드는지

        개발자의 의도가 명확하지 않은 경우에는 임의로 의도를 추측하여
        "반드시 수정해야 하는 문제"로 단정하지 않는다.

        필요한 경우 왜 이러한 구현을 선택했는지 확인하는 질문 형태의
        리뷰를 남긴다.


        [리뷰에서 우선적으로 찾아야 하는 문제]

        다음과 같이 실제 서비스에 영향을 줄 가능성이 있는 문제를 우선한다.

        - 실제 버그
        - 런타임 예외
        - 데이터 정합성 문제
        - 동시성 문제
        - 트랜잭션 문제
        - 보안 취약점
        - 잘못된 권한 처리
        - 성능 저하
        - 장애 가능성
        - API 계약 위반
        - 도메인 정책 위반
        - 프로젝트 컨벤션 위반
        - 테스트 누락으로 인해 회귀 가능성이 높은 변경


        [불필요한 리뷰 방지]

        단순한 개인 취향이나 대안 제시는 리뷰하지 않는다.

        현재 구현에 실질적인 문제가 없다면
        "이렇게도 작성할 수 있다"는 이유만으로 변경을 요구하지 않는다.

        특히 다음과 같은 리뷰는 지양한다.

        - 의미 없는 변수명 변경 제안
        - 동작에 영향이 없는 사소한 코드 스타일 제안
        - 근거 없는 리팩터링 요구
        - 프로젝트에서 사용하지 않는 디자인 패턴 도입 권고
        - 단순히 더 최신 기술이라는 이유만으로 변경 권고
        - 현재 요구사항과 관계없는 범위의 리팩터링


        [칭찬성 리뷰 금지]

        PR 리뷰에는 개발자가 행동할 필요가 없는 칭찬성 코멘트를 남기지 않는다.

        예:

        - "좋은 구현입니다."
        - "깔끔하게 작성되었습니다."
        - "적절한 접근입니다."
        - "잘 처리했습니다."
        - "좋은 리팩터링입니다."
        - "Best Practice를 잘 따르고 있습니다."

        이러한 코멘트는 코드 리뷰의 목적에 도움이 되지 않으므로 작성하지 않는다.

        문제가 없는 코드에는 굳이 코멘트를 남기지 않는다.

        리뷰 코멘트는 가능한 한 다음 중 하나의 목적이 있을 때만 작성한다.

        - 수정이 필요한 문제를 발견했을 때
        - 잠재적인 위험을 알릴 필요가 있을 때
        - 개발자의 의도를 확인해야 할 때
        - 프로젝트/도메인 규칙 위반 가능성이 있을 때
        - 테스트가 필요한 중요한 케이스가 누락되었을 때


    # =========================================================================
    # Project Documentation
    # =========================================================================
    #
    # docs는 단순 참고 자료가 아니라 프로젝트의 설계 의사결정과
    # 도메인 정책을 이해하기 위한 중요한 근거로 취급한다.
    #
    # 단, 문서가 항상 코드보다 절대적으로 옳다고 가정해서는 안 된다.
    #
    # PR 자체가 기존 정책을 변경하기 위한 작업일 수도 있기 때문이다.
    #
    # 따라서:
    #
    #   코드 != docs
    #
    # 를 발견했다고 바로 오류라고 판단하지 않고,
    # 이번 PR이 의도적으로 정책을 변경하는 것인지 확인하도록 한다.
    #
    - path: "docs/**"
      instructions: |
        docs 내부 문서는 이후 코드 리뷰에서 프로젝트의 요구사항,
        아키텍처, 도메인 정책 및 설계 의도를 이해하기 위한 중요한
        컨텍스트로 취급한다.

        문서에 명시된 정책과 코드가 다른 경우 바로 코드가 잘못되었다고
        단정하지 않는다.

        현재 PR 자체가 기존 정책이나 설계를 변경하기 위한 작업인지
        먼저 확인한다.

        문서와 구현이 서로 다르고 PR에서도 변경 의도를 확인할 수 없다면
        불일치 가능성을 리뷰에서 명확하게 지적한다.

        도메인별 문서가 존재한다면 해당 도메인의 코드를 리뷰할 때
        그 문서의 정책을 우선적으로 참고한다.


    # =========================================================================
    # Controller
    # =========================================================================

    - path: "src/main/java/**/*Controller.java"
      instructions: |
        프로젝트의 기존 Controller 구조와 API 컨벤션을 먼저 확인한다.

        그 기준을 바탕으로 다음을 검토한다.

        - Controller에 핵심 비즈니스 로직이 들어가 있지 않은지
        - Request validation이 필요한데 누락되지 않았는지
        - 프로젝트의 API 응답 규칙을 준수하는지
        - HTTP Method와 Status Code가 프로젝트 정책과 일치하는지
        - 인증/인가가 필요한 API가 적절하게 보호되는지
        - Entity가 외부 API에 의도치 않게 직접 노출되지 않는지

        일반적인 REST API 관례보다 프로젝트에서 이미 합의한
        API 컨벤션이 있다면 프로젝트 컨벤션을 우선한다.


    # =========================================================================
    # Service / Transaction
    # =========================================================================

    - path: "src/main/java/**/*Service.java"
      instructions: |
        Service를 리뷰할 때 단순히 메서드 길이나 코드 형태만 평가하지 않는다.

        해당 Service가 담당하는 도메인 책임과 개발자의 구현 목적을 먼저 파악한다.

        이후 다음을 확인한다.

        - 도메인 정책이 올바르게 구현되어 있는지
        - 트랜잭션 경계가 의도한 작업 단위와 일치하는지
        - 예외 발생 시 일부 데이터만 반영될 가능성이 있는지
        - 외부 시스템 호출과 DB 트랜잭션의 결합으로 장애 가능성이 생기는지
        - 기존 도메인 Service와 책임이 중복되지 않는지

        @Transactional이 없다는 이유만으로 무조건 추가하도록 요구하거나,
        존재한다는 이유만으로 유지하도록 판단하지 않는다.

        실제 데이터 변경 범위와 실패 시 rollback 요구사항을 기준으로 판단한다.


    # =========================================================================
    # Repository / Database
    # =========================================================================

    - path: "src/main/java/**/*Repository.java"
      instructions: |
        Repository 변경은 실제 호출 방식과 데이터 규모를 함께 고려한다.

        다음을 우선적으로 확인한다.

        - N+1 Query 가능성
        - 불필요한 전체 데이터 조회
        - 잘못된 단건/다건 조회 가정
        - 동시 수정 시 데이터 정합성 문제
        - 대량 데이터에서 명확한 성능 문제가 발생할 수 있는 쿼리

        단순히 더 복잡한 쿼리 최적화가 가능하다는 이유만으로
        변경을 요구하지 않는다.

        실제 사용 패턴에서 문제가 될 가능성이 있을 때만 리뷰한다.


    # =========================================================================
    # Coupon Domain
    # =========================================================================
    #
    # 쿠폰 도메인에서는 일반적인 코드 품질보다
    # 발급 정책과 데이터 정합성이 훨씬 중요하다.
    #
    # 특히 선착순 발급은 정상적인 단일 요청 테스트만으로는 발견하기 어려운
    # Race Condition이 존재할 수 있으므로 이를 우선적으로 확인한다.
    #
    - path: "src/main/java/**/coupon/**"
      instructions: |
        쿠폰 도메인의 기존 코드와 docs에 정의된 쿠폰 정책을 먼저 확인하고
        이번 PR에서 개발자가 변경하려는 정책을 파악한다.

        그 이후 다음을 중점적으로 검토한다.

        - 동일 사용자 중복 발급 가능성
        - 쿠폰 재고 초과 발급 가능성
        - 재고가 음수가 될 가능성
        - 동시에 여러 요청이 들어왔을 때 Race Condition 발생 가능성
        - 멱등성이 필요한 작업의 중복 처리 가능성
        - 쿠폰 이벤트 상태와 발급 가능 여부의 불일치
        - 이벤트 오픈/종료 시간 검증 오류
        - Redis와 DB 사이의 데이터 정합성
        - 처리 중 예외 발생 시 잘못된 상태가 남을 가능성

        기존 쿠폰 정책과 구현이 다르더라도 이번 PR에서 정책 자체를
        변경하려는 의도가 확인된다면 기존 구현과 다르다는 이유만으로
        오류라고 판단하지 않는다.


    # =========================================================================
    # Time / UTC
    # =========================================================================
    #
    # 시간 관련 문제는 실행 서버의 timezone에 따라
    # 개발 환경에서는 정상이고 운영 환경에서는 실패하는 문제가 생길 수 있다.
    #
    # 따라서 단순 API 사용 여부보다 "프로젝트에서 정한 시간 기준"을 중심으로 본다.
    #
    - path: "src/main/java/**"
      instructions: |
        시간 관련 코드가 변경된 경우 프로젝트에서 정의한 시간 정책을 먼저 확인한다.

        UTC를 기준으로 저장하거나 비교하도록 정의된 영역이라면
        서버 로컬 timezone에 의존하는 코드가 없는지 확인한다.

        특히 다음을 검토한다.

        - 서버 timezone에 따라 결과가 달라질 가능성
        - UTC와 KST 등 서로 다른 시간 기준의 혼용
        - DB 저장 시간과 애플리케이션 비교 시간의 기준 불일치
        - LocalDateTime.now() 등의 직접 호출이 실행 환경에 의존하는지
        - 현재 시간에 의존하는 로직의 테스트 가능성

        Clock 등의 사용을 기계적으로 강제하지 않는다.

        테스트 가능성과 timezone 일관성 문제가 실제로 존재하는 경우에만
        대안을 제안한다.


    # =========================================================================
    # Tests
    # =========================================================================

    - path: "src/test/**"
      instructions: |
        테스트 개수나 coverage 자체보다 변경된 비즈니스 로직의 위험을
        제대로 검증하고 있는지를 우선적으로 판단한다.

        정상 케이스만 확인하지 말고 변경 내용에 따라 필요한 경우 다음을 검토한다.

        - 실패 케이스
        - 경계값
        - 잘못된 입력
        - 중복 요청
        - 재고 소진
        - 이벤트 시작 직전/시작 시점/종료 시점
        - 동시 요청
        - 예외 발생 후 데이터 상태

        모든 메서드에 테스트를 요구하지 않는다.

        이번 PR에서 변경된 동작 중 회귀 발생 가능성이 높거나
        비즈니스적으로 중요한 부분에 테스트가 누락된 경우에만 지적한다.
        
            # =========================================================================
    # CI / Build Failure Analysis
    # =========================================================================
    #
    # PR에서 CI가 실패한 경우 단순히 "CI 실패"라고만 언급하지 않고,
    # 가능한 범위에서 실패 로그와 변경 코드를 연결하여 원인을 분석한다.
    #
    # 리뷰의 목적은 증상을 반복하는 것이 아니라
    # "어떤 변경 때문에, 어떤 단계에서, 왜 실패했는지"를 설명하는 것이다.
    #
    - path: "**"
      instructions: |
        PR의 CI 또는 build check가 실패한 경우,
        접근 가능한 CI 결과와 로그를 확인하여 실패 원인을 분석한다.

        단순히 "CI가 실패했습니다"라는 코멘트는 남기지 않는다.

        가능한 경우 다음 순서로 설명한다.

        1. 실패한 CI job 또는 step
        2. 실제 에러 메시지의 핵심 원인
        3. 이번 PR 변경사항과의 관련성
        4. 가장 가능성이 높은 수정 지점
        5. 재현 또는 검증 방법

        예를 들어 다음과 같이 구체적으로 구분한다.

        - Java compile 실패
        - Gradle build 실패
        - 테스트 assertion 실패
        - Spring ApplicationContext 로딩 실패
        - Bean 생성 실패
        - DB / Redis / Kafka 연결 실패
        - 환경변수 또는 secret 누락
        - formatting / lint 실패
        - Docker build 실패
        - migration 실패

        에러 로그만으로 원인을 확정할 수 없는 경우
        추측을 사실처럼 표현하지 않는다.

        이 경우에는
        "가장 가능성이 높은 원인"과
        "추가로 확인해야 하는 로그 또는 설정"을 구분해서 설명한다.

        CI 실패가 이번 PR의 코드 변경과 무관하고
        외부 인프라 또는 일시적인 runner 문제로 보이는 경우에도
        코드 문제로 단정하지 않는다.