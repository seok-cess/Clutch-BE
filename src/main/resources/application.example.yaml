spring:
  application:
    name: clutch
  profiles:
    # 모든 환경은 실제 LoL Esports API(REAL)로 시작한다.
    # 운영자 화면에서 STUB으로 전환한 경우에만 replay 서버를 사용한다.
    default: operator-routing
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/clutch?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:clutch}
    password: ${DB_PASSWORD:clutch_local_password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:clutch_local_password}
      timeout: 2s
  session:
    redis:
      namespace: clutch:session
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:clutch-local}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
server:
  tomcat:
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:25000}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# ---- 경기 시청시간 기반 포인트 지급 ----
watch:
  reward:
    heartbeat-interval: ${WATCH_REWARD_HEARTBEAT_INTERVAL:30s}
    alive-ttl: ${WATCH_REWARD_ALIVE_TTL:90s}
    active-ttl: ${WATCH_REWARD_ACTIVE_TTL:120s}
    session-ttl: ${WATCH_REWARD_SESSION_TTL:1h}
    switch-lock-ttl: ${WATCH_REWARD_SWITCH_LOCK_TTL:10s}
    max-eligible-interval: ${WATCH_REWARD_MAX_ELIGIBLE_INTERVAL:60s}
    claim-interval: ${WATCH_REWARD_CLAIM_INTERVAL:5m}
    points-per-claim: ${WATCH_REWARD_POINTS_PER_CLAIM:100}

# ---- 쿠폰 이벤트 회차 만료 처리 ----
coupon:
  claim:
    kafka:
      accepted-group: ${COUPON_CLAIM_ACCEPTED_GROUP:coupon-wallet-issuer}
  stock-recovery:
    interval-ms: ${COUPON_STOCK_RECOVERY_INTERVAL_MS:2000}
  test:
    event:
      expiration-interval-ms: ${COUPON_TEST_EVENT_EXPIRATION_INTERVAL_MS:1000}

# ---- 세트별 승패 배팅 ----
betting:
  first-set-open-before-start: ${BETTING_FIRST_SET_OPEN_BEFORE_START:20m}
  # 모든 세트의 실제 시작 후 배팅 유예 시간 (키 이름은 기존 호환성 유지)
  first-set-close-after-start: ${BETTING_FIRST_SET_CLOSE_AFTER_START:1m}
  # 다음 세트의 실제 시작 시각을 아직 받지 못했을 때만 쓰는 안전 마감 시간
  next-set-betting-duration: ${BETTING_NEXT_SET_BETTING_DURATION:20m}
  synchronization-interval: ${BETTING_SYNCHRONIZATION_INTERVAL:1s}
  # 라이브 목록에서 사라진 종료 세트의 공식 gameWins 결과 재조회 주기
  result-reconciliation-interval: ${BETTING_RESULT_RECONCILIATION_INTERVAL:1m}

# ---- lolesports 비공식 피드 연동 ----
lolesports:
  # lolesports.com 프론트엔드에 공개된 공용 키
  api-key: ${LOLESPORTS_API_KEY:0TvQnueqKa5mxJntVWt0w4LpLfEkrV1Ta8rQBb9Z}
  esports-api-base-url: https://esports-api.lolesports.com/persisted/gw
  live-stats-base-url: https://feed.lolesports.com/livestats/v1
  locale: ko-KR
  # getLeagues 실호출로 확인한 LCK id
  league-id: "98767991310872058"
  # getTournamentsForLeague 로 확인 — 시즌이 바뀌면 교체해야 한다
  tournament-id: "115548147890329817"
  # livestats 는 "요청 창의 끝이 N초 이상 과거"여야 응답한다 (경기마다 다름).
  # 400 응답 본문의 요구치를 읽어 자동 상향되므로 초기값만 둔다.
  live-stats-lag-seconds: 30
  # 재생 여유(초). 소스가 10초 블록으로 주므로 그만큼 뒤에서 재생해야 끊기지 않는다.
  display-lag-seconds: 15
  # 매치 종료 판정 후 라이브 목록에 남겨둘 시간(초).
  # 소스 getLive 는 경기가 끝나도 언제 내려갈지 예측할 수 없어 우리가 직접 내린다.
  live-retain-after-finish-seconds: 300
  # livestats 를 제공하지 않는 리그 (getLive 는 전 리그를 주므로 여기서 걸러 부하를 줄인다).
  # 리그명은 getLive/getSchedule 의 league.name 과 정확히 일치해야 한다.
  stats-disabled-leagues:
    - LRN
  poll:
    live-check-ms: 60000    # getLive 감시 주기
    in-game-ms: 1000        # window/details 인게임 폴링 주기
    meta-ms: 300000         # 일정/순위 갱신 (5분)
    backoff-base-ms: 5000   # 연속 실패 시 백오프 시작 간격
    backoff-max-ms: 300000  # 백오프 상한
