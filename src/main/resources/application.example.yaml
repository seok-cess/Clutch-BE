spring:
  application:
    name: clutch
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/clutch?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:clutch}
    password: ${DB_PASSWORD:clutch_local_password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:clutch_local_password}
      timeout: 2s
  session:
    redis:
      namespace: clutch:session
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:clutch-local}
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
