name: Deploy Dev

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on:
      - self-hosted
      - windows
      - x64

    env:
      MYSQL_EXPORTER_PASSWORD: ${{ secrets.MYSQL_EXPORTER_PASSWORD }}
      DB_POOL_SIZE: ${{ secrets.DB_POOL_SIZE }}

    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: Prepare application config
        shell: powershell
        run: |
          Copy-Item -LiteralPath src/main/resources/application.example.yaml `
            -Destination src/main/resources/application.yaml `
            -Force

      - name: Deploy
        shell: powershell
        run: |
          docker compose up -d --wait mysql redis kafka
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          docker compose up -d --force-recreate mysql-exporter redis-exporter
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          docker compose --profile app up -d --build --force-recreate --no-deps --wait app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          docker compose --profile app ps
