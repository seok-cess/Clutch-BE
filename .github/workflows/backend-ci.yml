name: Backend CI

on:
  pull_request:
    branches:
      - dev

jobs:
  build:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    env:
      MYSQL_DATABASE: clutch
      MYSQL_USER: clutch_ci
      MYSQL_PASSWORD: ci_test_password
      MYSQL_ROOT_PASSWORD: ci_root_test_password
      REDIS_PASSWORD: ci_redis_test_password
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/clutch?serverTimezone=UTC&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: clutch_ci
      SPRING_DATASOURCE_PASSWORD: ci_test_password
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ci_redis_test_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Start infrastructure
        run: docker compose up -d --wait

      - name: Check containers
        run: docker compose ps

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build and Test
        run: ./gradlew clean build

      - name: Stop infrastructure
        if: always()
        run: docker compose down -v
