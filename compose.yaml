name: clutch

services:
  mysql:
    image: mysql:8.4.7
    restart: unless-stopped
    environment:
      TZ: UTC
      MYSQL_DATABASE: ${MYSQL_DATABASE:-clutch}
      MYSQL_USER: ${MYSQL_USER:-clutch}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-clutch_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-clutch_root_local_password}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping --host=127.0.0.1 --user=root --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  mysql-exporter:
    image: prom/mysqld-exporter:v0.20.0
    restart: unless-stopped
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD}
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=exporter
    ports:
      - "9104:9104"
    depends_on:
      mysql:
        condition: service_healthy

  redis:
    image: redis:8.4.4-alpine
    restart: unless-stopped
    environment:
      TZ: UTC
      REDIS_PASSWORD: ${REDIS_PASSWORD:-clutch_local_password}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --notify-keyspace-events
      - Ex
      - --requirepass
      - ${REDIS_PASSWORD:-clutch_local_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep PONG
      interval: 5s
      timeout: 3s
      retries: 10

  redis-exporter:
    image: oliver006/redis_exporter:v1.89.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-clutch_local_password}
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy

  kafka:
    image: apache/kafka:4.2.0
    restart: unless-stopped
    environment:
      TZ: UTC
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092},PLAINTEXT://kafka:19092
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  app:
    profiles: [app]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: UTC
      # 컨테이너 배포는 REAL로 시작하고 운영자 API를 통해서만 STUB으로 전환한다.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-operator-routing}
      REPLAY_SERVER_URL: http://replay:4000
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-clutch}?serverTimezone=UTC&characterEncoding=UTF-8
      DB_USERNAME: ${MYSQL_USER:-clutch}
      DB_PASSWORD: ${MYSQL_PASSWORD:-clutch_local_password}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-clutch_local_password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      LOLESPORTS_API_KEY: ${LOLESPORTS_API_KEY:-0TvQnueqKa5mxJntVWt0w4LpLfEkrV1Ta8rQBb9Z}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
      SERVER_TOMCAT_MAX_CONNECTIONS: ${SERVER_TOMCAT_MAX_CONNECTIONS:-25000}
      SERVER_TOMCAT_MBEANREGISTRY_ENABLED: "true"
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:8080/actuator/health]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  replay:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /workspace/replay
    command: [node, replay-server.js, --dir, fixtures/sample-match-bo3-001, --speed, "1"]
    ports:
      - "4000:4000"
    volumes:
      - ./replay:/workspace/replay:ro

  k6:
    profiles: [load-test]
    image: grafana/k6:2.0.0
    environment:
      BASE_URL: ${K6_BASE_URL:-http://host.docker.internal:8080}
      SMOKE_VUS: ${SMOKE_VUS:-5}
      SMOKE_DURATION: ${SMOKE_DURATION:-10s}
    volumes:
      - ./k6:/scripts:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    command: [run, /scripts/smoke.js]

volumes:
  mysql-data:
  redis-data:
  kafka-data:
